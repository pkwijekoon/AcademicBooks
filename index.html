
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#005a32">
    <title>AcademicBooks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HOME PAGE -->
    <main id="home-page">
        <header class="home-header">
            <h1>AcademicBooks</h1>
        </header>

        <section class="library">
            <article class="book-card">
                <img
                    class="book-cover"
                    src="covers/introduction-to-r.jpg"
                    alt="Introduction to R book cover"
                    onerror="this.style.display='none'"
                >

                <h2>Introduction to R</h2>

                <button
                    type="button"
                    class="open-book-button"
                    id="open-introduction-to-r"
                >
                    READ BOOK
                </button>
            </article>
        </section>
    </main>

    <!-- READING PAGE -->
    <section id="reader" class="reader hidden" aria-label="Book reader">

        <header class="reader-topbar">
            <span id="page-number">Page 1 of 1</span>
        </header>

        <main id="reading-area" class="reading-area">
            <div id="loading-message" class="status-message">
                Loading book...
            </div>

            <div id="error-message" class="status-message hidden">
                <p id="error-text">The book could not be opened.</p>
                <button type="button" id="retry-button">TRY AGAIN</button>
            </div>

            <canvas id="pdf-canvas" class="hidden"></canvas>
        </main>

        <footer class="reader-bottombar">
            <button
                type="button"
                id="close-button"
                class="reader-button close-button"
            >
                CLOSE
            </button>

            <nav class="page-navigation" aria-label="Page navigation">
                <button
                    type="button"
                    id="previous-button"
                    class="reader-button"
                    disabled
                >
                    ◀ PREVIOUS
                </button>

                <button
                    type="button"
                    id="next-button"
                    class="reader-button"
                    disabled
                >
                    NEXT ▶
                </button>
            </nav>
        </footer>

    </section>

    <script type="module" src="script.js"></script>
</body>
</html>
